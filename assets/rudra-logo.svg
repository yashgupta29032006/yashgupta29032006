<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="coreShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Orbit Track -->
  <circle cx="96" cy="96" r="86" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.4"/>
  <circle cx="96" cy="96" r="86" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="18 46" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Triad Autonomous Orbital Blades -->
  <g id="triad-wings">
    <!-- Wing 0 -->
    <path d="M 96 16 C 136 16 172 48 176 90 C 160 76 136 68 116 70 C 132 82 140 102 136 122 C 124 100 102 88 80 88 C 88 72 90 48 96 16 Z" 
          fill="url(#bladeGrad1)" opacity="0.95"/>
    
    <!-- Wing 120 -->
    <path d="M 96 16 C 136 16 172 48 176 90 C 160 76 136 68 116 70 C 132 82 140 102 136 122 C 124 100 102 88 80 88 C 88 72 90 48 96 16 Z" 
          transform="rotate(120 96 96)" fill="url(#bladeGrad1)" opacity="0.95"/>

    <!-- Wing 240 -->
    <path d="M 96 16 C 136 16 172 48 176 90 C 160 76 136 68 116 70 C 132 82 140 102 136 122 C 124 100 102 88 80 88 C 88 72 90 48 96 16 Z" 
          transform="rotate(240 96 96)" fill="url(#bladeGrad1)" opacity="0.95"/>
  </g>

  <!-- 3 Satellite Agent Nodes at Apex Points -->
  <circle cx="96" cy="16" r="5" fill="#2dd4bf" stroke="#0f172a" stroke-width="1.5" filter="url(#subtleGlow)"/>
  <circle cx="96" cy="16" r="2" fill="#ffffff"/>
  
  <g transform="rotate(120 96 96)">
    <circle cx="96" cy="16" r="5" fill="#2dd4bf" stroke="#0f172a" stroke-width="1.5" filter="url(#subtleGlow)"/>
    <circle cx="96" cy="16" r="2" fill="#ffffff"/>
  </g>

  <g transform="rotate(240 96 96)">
    <circle cx="96" cy="16" r="5" fill="#2dd4bf" stroke="#0f172a" stroke-width="1.5" filter="url(#subtleGlow)"/>
    <circle cx="96" cy="16" r="2" fill="#ffffff"/>
  </g>

  <!-- Central Core Enclosure -->
  <!-- Mechanical dark collar -->
  <circle cx="96" cy="96" r="38" fill="url(#coreShell)" stroke="#334155" stroke-width="2"/>
  
  <!-- Precision inner track -->
  <circle cx="96" cy="96" r="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.7"/>
  
  <!-- Luminous Energy Singularity -->
  <circle cx="96" cy="96" r="24" fill="url(#coreGlow)" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- High Intensity Core Center -->
  <circle cx="96" cy="96" r="10" fill="#ffffff" filter="url(#subtleGlow)"/>
  <circle cx="96" cy="96" r="4" fill="#0284c7"/>
</svg>